<style>
  :root{
    --blue:#0053a0;
    --gold:#fdbe11;
    --slate:#2b4964;
    --bg:#ffffff;
    --surface:#f8f9fa;
    --surface2:#e9ecef;
    --line:#dee2e6;
    --text:#212529;
    --muted:#6c757d;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Bebas Neue',sans-serif;
    letter-spacing:1px;
    font-weight:400;
    margin:0;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;}
  img{max-width:100%;display:block;}
  ::selection{background:var(--gold);color:#111;}

  /* ---- Layout Shell ---- */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .container{width:100%;max-width:1180px;margin:0 auto;padding:0 22px;}

  /* ---- Nav ---- */
  .nav{
    position:sticky;top:0;z-index:50;
    background:#ffffff;
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(6px);
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;max-width:1180px;margin:0 auto;}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Bebas Neue';font-size:26px;letter-spacing:2px;color:var(--slate);}
  .logo .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);}
  .logo span{color:var(--blue);}
  .nav-links{display:flex;gap:4px;align-items:center;}
  .nav-btn{
    background:transparent;color:var(--muted);padding:9px 16px;border-radius:999px;
    font-weight:700;font-size:13px;letter-spacing:.4px;text-transform:uppercase;
    transition:all .15s ease;
  }
  .nav-btn:hover{color:var(--text);}
  .nav-btn.active{background:var(--blue);color:#fff;}
  .nav-user{
    display:flex;align-items:center;gap:8px;background:var(--surface2);
    padding:6px 8px 6px 14px;border-radius:999px;font-size:13px;font-weight:700;
    border:1px solid var(--line);
  }
  .nav-user .lvl{background:var(--gold);color:#1a1200;padding:4px 10px;border-radius:999px;font-size:11px;}
  .icon-btn{width:30px;height:30px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text);}

  /* ---- Buttons ---- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 26px;border-radius:999px;font-weight:800;font-size:14px;
    letter-spacing:.3px;transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn-gold{background:var(--gold);color:#1a1200;}
  .btn-gold:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(253,190,17,.3);}
  .btn-blue{background:var(--blue);color:#fff;}
  .btn-blue:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,83,160,.3);}
  .btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--text);}
  .btn-outline:hover{border-color:var(--blue);color:var(--blue);}
  .btn-ghost{background:var(--surface2);color:var(--text);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none !important;box-shadow:none !important;}
  .btn-sm{padding:8px 16px;font-size:12px;}
  .btn-full{width:100%;}

  /* ---- Misc UI ---- */
  .eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--blue);font-weight:800;}
  .muted{color:var(--muted);}
  .section{padding:60px 0;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--surface2);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--slate);border:1px solid var(--line);}

  /* Estatus Badges */
  .status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;}
  .status-por-pagar{background:#fff3cd;color:#856404;border:1px solid #ffeeba;}
  .status-no-pagado{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;}
  .status-pagado{background:#d4edda;color:#155724;border:1px solid #c3e6cb;}

  /* ---- Hero / Cartelera ---- */
  .hero{
    position:relative;height:78vh;min-height:480px;display:flex;align-items:flex-end;
    background-size:cover;background-position:center;
  }
  .hero::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(0deg,#fff 2%, rgba(255,255,255,.6) 45%, rgba(255,255,255,.2) 100%),
               linear-gradient(90deg, rgba(0,0,0,.75) 0%, rgba(0,0,0,.1) 60%);
  }
  .hero-content{position:relative;z-index:2;padding:0 22px 46px;max-width:1180px;margin:0 auto;width:100%;color:#111;}
  .hero-title{font-size:clamp(38px,7vw,84px);line-height:.95;max-width:720px;color:var(--slate);}
  .hero-meta{display:flex;gap:10px;margin:14px 0 16px;flex-wrap:wrap;}
  .hero-syn{max-width:560px;color:#333;margin-bottom:22px;font-size:15px;line-height:1.55;}
  .hero-actions{display:flex;gap:12px;flex-wrap:wrap;}

  .marquee{padding:34px 0 10px;}
  .marquee-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .marquee-head h2{font-size:40px;color:var(--slate);}

  .poster-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px;}
  .poster-card{cursor:pointer;position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--surface);transition:transform .18s ease, border-color .18s ease;}
  .poster-card:hover{transform:translateY(-6px);border-color:var(--blue);}
  .poster-card .pimg{aspect-ratio:2/3;overflow:hidden;background:#dee2e6;}
  .poster-card .pimg img{width:100%;height:100%;object-fit:cover;}
  .poster-card .pinfo{padding:14px;}
  .poster-card h3{font-size:20px;line-height:1.1;margin-bottom:6px;color:var(--slate);}
  .poster-card .lang{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px;}
  .play-chip{position:absolute;top:10px;right:10px;background:rgba(255,255,255,0.9);color:var(--blue);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid var(--line);z-index:3;}

  /* ---- Showtime / Detail Page ---- */
  .detail-banner{height:300px;background-size:cover;background-position:center;position:relative;background-color:#dee2e6;}
  .detail-banner::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#fff 0%, rgba(255,255,255,.5) 60%, transparent 100%);}
  .detail-body{max-width:1180px;margin:-70px auto 0;padding:0 22px 40px;position:relative;z-index:2;}
  .detail-top{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap;margin-bottom:30px;}
  .detail-poster{width:170px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;border:3px solid #fff;box-shadow:0 10px 25px rgba(0,0,0,.15);flex-shrink:0;background:#dee2e6;}
  .detail-poster img{width:100%;height:100%;object-fit:cover;}
  .detail-title-block h1{font-size:44px;color:var(--slate);}
  .detail-syn{max-width:640px;color:var(--muted);font-size:14.5px;line-height:1.6;margin-top:8px;}

  .step-label{display:flex;align-items:center;gap:10px;margin:30px 0 16px;}
  .step-label .num{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .step-label h3{font-family:'Manrope';font-size:15px;text-transform:uppercase;letter-spacing:1px;font-weight:800;color:var(--slate);}

  .date-row,.time-row{display:flex;gap:10px;flex-wrap:wrap;}
  .pill{
    padding:12px 18px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);
    font-weight:800;font-size:13px;text-align:center;min-width:64px;transition:.15s ease;cursor:pointer;color:var(--slate);
  }
  .pill:hover{border-color:var(--blue);}
  .pill.selected{background:var(--blue);color:#fff;border-color:var(--blue);}
  .pill .d1{display:block;font-size:10px;text-transform:uppercase;color:inherit;opacity:.8;}
  .pill .d2{display:block;font-size:16px;font-family:'Bebas Neue';}

  /* Seats */
  .screen-wrap{text-align:center;margin:14px 0 26px;}
  .screen{
    width:100%;max-width:480px;height:8px;margin:0 auto 6px;border-radius:0 0 40px 40px/8px;
    background:linear-gradient(180deg, var(--blue), transparent);
    box-shadow:0 8px 20px -4px rgba(0,83,160,.4);
  }
  .screen-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
  .seat-map{display:flex;flex-direction:column;gap:10px;align-items:center;margin:20px 0;}
  .seat-row{display:flex;gap:10px;align-items:center;}
  .row-tag{width:20px;font-weight:800;color:var(--slate);font-size:14px;}
  .seat{
    width:38px;height:34px;border-radius:8px 8px 4px 4px;background:var(--surface2);
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:var(--slate);transition:.12s ease;cursor:pointer;
  }
  .seat:hover{border-color:var(--blue);background:#fff;}
  .seat.selected{background:var(--gold);border-color:var(--gold);color:#1a1200;}
  .legend{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  .legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:600;}
  .legend-swatch{width:16px;height:14px;border-radius:4px;background:var(--surface2);border:1.5px solid var(--line);}
  .legend-swatch.sel{background:var(--gold);border-color:var(--gold);}

  .action-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px;}

  /* ---- Dulceria ---- */
  .snack-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:20px;}
  .snack-card{padding:20px;}
  .snack-card h3{font-size:22px;margin-bottom:4px;color:var(--slate);}
  .field-label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:800;margin:12px 0 6px;}
  select, input[type=text], input[type=email], input[type=date], input[type=password], textarea{
    width:100%;background:#fff;border:1.5px solid var(--line);color:var(--text);
    padding:11px 13px;border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;
  }
  select:focus, input:focus, textarea:focus{outline:2px solid var(--blue);outline-offset:1px;}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{padding:8px 12px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--line);font-size:12px;font-weight:700;color:var(--slate);}
  .chip input{accent-color:var(--blue);}
  .qty-row{display:flex;align-items:center;gap:12px;margin-top:14px;}
  .qty-btn{width:32px;height:32px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--line);color:var(--slate);font-size:16px;font-weight:800;cursor:pointer;}
  .price-tag{font-family:'Bebas Neue';font-size:22px;color:var(--blue);}

  /* Order Summary Sidebar */
  .order-panel{position:sticky;top:90px;}
  .order-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .order-item:last-child{border-bottom:none;}
  .order-item .oi-name{font-weight:700;color:var(--slate);}
  .order-item .oi-sub{color:var(--muted);font-size:11.5px;margin-top:2px;}
  .order-total-row{display:flex;justify-content:space-between;padding-top:14px;margin-top:8px;border-top:2px solid var(--line);font-family:'Bebas Neue';font-size:24px;color:var(--slate);}
  .rm-btn{background:transparent;color:#dc3545;font-size:11px;font-weight:800;cursor:pointer;padding:0;}

  /* Ticket Motif */
  .ticket{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden;
  }

  /* Pago */
  .pago-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:start;}
  .pay-method{display:flex;gap:12px;margin-top:8px;}
  .pay-opt{flex:1;padding:16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);text-align:center;font-weight:800;font-size:13px;cursor:pointer;color:var(--slate);}
  .pay-opt.selected{border-color:var(--blue);background:rgba(0,83,160,.08);color:var(--blue);}
  .pay-opt.disabled{opacity:.4;cursor:not-allowed;}
  .tab-row{display:flex;gap:10px;margin-bottom:20px;}
  .tab-btn{flex:1;padding:12px;border-radius:10px;background:var(--surface2);border:1.5px solid var(--line);font-weight:800;font-size:13px;cursor:pointer;color:var(--slate);}
  .tab-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}

  /* QR */
  .qr{width:150px;height:150px;margin:0 auto;border-radius:10px;background:#fff;padding:8px;border:1px solid var(--line);}

  /* Pronto */
  .pronto-card{display:grid;grid-template-columns:220px 1fr;gap:26px;padding:24px;align-items:center;}
  @media(max-width:640px){.pronto-card{grid-template-columns:1fr;}}

  /* Rewards */
  .tier-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:24px;}
  .tier-card{padding:22px;border-top:4px solid var(--slate);cursor:pointer;transition:transform .12s ease;}
  .tier-card:hover{transform:translateY(-2px);}
  .tier-card.star{border-top-color:#adb5bd;}
  .tier-card.planet{border-top-color:var(--blue);}
  .tier-card.galaxy{border-top-color:var(--gold);}
  .tier-card h3{font-size:26px;margin-bottom:4px;color:var(--slate);}
  .tier-card ul{padding-left:18px;margin:12px 0 0;font-size:13px;color:var(--muted);line-height:1.9;}

  .member-card{
    max-width:420px;border-radius:18px;padding:26px;position:relative;overflow:hidden;
    background:linear-gradient(135deg, var(--slate), #18283b);
    border:1px solid var(--line); color:#fff;
  }
  .member-card .lvltag{font-family:'Bebas Neue';font-size:26px;color:var(--gold);letter-spacing:2px;}
  .member-card .cname{font-size:20px;font-weight:800;margin-top:16px;}
  .member-card .cmeta{color:#adb5bd;font-size:12px;margin-top:4px;}
  .member-card .pts{font-family:'Bebas Neue';font-size:46px;margin-top:14px;color:#fff;}

  /* Footer */
  footer{margin-top:auto;border-top:1px solid var(--line);background:var(--surface);padding:50px 0 26px;}
  .footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:34px;}
  @media(max-width:720px){.footer-grid{grid-template-columns:1fr;}}
  .footer-grid h4{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--blue);margin-bottom:14px;}
  .footer-grid p{color:var(--muted);font-size:13.5px;line-height:1.6;}
  .footer-links a{display:block;color:var(--muted);font-size:13.5px;padding:5px 0;font-weight:600;cursor:pointer;}
  .footer-links a:hover{color:var(--blue);}
  .footer-bottom{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center;}

  /* Overlay / Modals */
  .overlay{position:fixed;inset:0;background:rgba(255,255,255,0.95);z-index:100;overflow-y:auto;}
  .overlay-inner{max-width:640px;margin:40px auto;padding:30px 22px;background:#fff;border-radius:var(--radius);border:1px solid var(--line);box-shadow:0 15px 35px rgba(0,0,0,.1);}
  .star-row{display:flex;gap:8px;}
  .star-btn{font-size:28px;color:var(--line);background:transparent;cursor:pointer;}
  .star-btn.on{color:var(--gold);}
  .fb-row{margin-bottom:20px;}
  .fb-row label{display:block;font-weight:700;font-size:14px;margin-bottom:8px;color:var(--slate);}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--slate);
    border:1px solid var(--gold);color:#fff;padding:14px 22px;border-radius:12px;font-weight:700;font-size:13px;
    z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;align-items:center;gap:10px;
  }
  @media(max-width:900px){
    .pago-grid{grid-template-columns:1fr;}
    .detail-top{align-items:center;}
    .detail-poster{width:130px;}
  }
</style>
</head>

function placeOrder(){
  let name, email;
  const u = currentUser();
  if(u){
    name = u.name; email = u.email;
  } else {
    name = document.getElementById('guest-name')?.value.trim();
    email = document.getElementById('guest-email')?.value.trim();
    if(!name || !email){ toast('⚠️ Ingresa tu nombre y correo electrónico'); return; }
  }

  const items = [];
  if(S.activeMovie && S.selectedDate && S.selectedTime && S.selectedSeats.length){
    items.push(`${S.activeMovie.title} — ${S.selectedDate}, ${S.selectedTime}, Butacas: ${S.selectedSeats.join(', ')}`);
  }
  S.snackCart.forEach(i=> items.push(`${i.label} ×${i.qty} (${i.detail})`));

  const total = orderTotal();
  const code = 'SC-'+Math.random().toString(36).slice(2,8).toUpperCase();
  
  // Estatus inicial por pagar (amarillo) al pagarse en taquilla
  const ticketStatus = 'por pagar';

  const ticket = {
    code, name, email, items, total,
    date: new Date().toLocaleString('es-MX'),
    payMethod: S.payMethod,
    movie: S.activeMovie ? S.activeMovie : null,
    status: ticketStatus
  };
  S.lastTicket = ticket;

  if(u && !u.isStaff){
    u.purchases.push(ticket);
    const t = tierInfo(u.purchases.length);
    u.points += Math.floor(total / t.divisor);
  } else {
    S.guestPurchases.push(ticket);
  }

  const templateParams = {
    name: name,
    email: email,
    order_id: code,
    name_pelicula: S.activeMovie ? S.activeMovie.title : 'Artículos de Dulcería / Varios',
    units: S.selectedSeats.length ? S.selectedSeats.length : '1',
    price: total.toFixed(2)
  };

  emailjs.send("service_jk76uvi$", "template_eisldou", templateParams)
    .then(function(response) {
       console.log('SUCCESS!', response.status, response.text);
       toast('Correo enviado con éxito. Boleto disponible en Rewards.');
    }, function(error) {
       console.log('FAILED...', error);
       toast('⚠️ Error al enviar el correo automático, pero tu orden ha sido registrada.');
    });

  S.activeMovie=null; S.selectedDate=null; S.selectedTime=null; S.selectedSeats=[];
  S.snackCart=[];

  S.view='ticket';
  render(); window.scrollTo(0,0);
}

function updateTicketStatus(code, newStatus){
  // Buscar en lastTicket
  if(S.lastTicket && S.lastTicket.code.toLowerCase() === code.toLowerCase()){
    S.lastTicket.status = newStatus;
  }
  // Buscar en cuentas
  for(const accKey in S.accounts){
    const found = S.accounts[accKey].purchases.find(p => p.code.toLowerCase() === code.toLowerCase());
    if(found){ found.status = newStatus; break; }
  }
  // Buscar en invitados
  const foundGuest = S.guestPurchases.find(p => p.code.toLowerCase() === code.toLowerCase());
  if(foundGuest){ foundGuest.status = newStatus; }

  toast(`Estatus actualizado a: ${newStatus.toUpperCase()}`);
  render();
}

/* ---- QR Scanner Implementation (Html5-Qrcode) ---- */
let html5QrCodeScannerInstance = null;

function startScanner(){
  S.scannerActive = true;
  S.scanResult = null;
  render();
  
  setTimeout(() => {
    try {
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };
      html5QrCodeScannerInstance = new Html5QrcodeScanner("reader", config, /* verbose= */ false);
      html5QrCodeScannerInstance.render(onScanSuccess, onScanFailure);
    } catch(e) {
      console.error(e);
      toast('⚠️ Error al iniciar la cámara para el escáner');
    }
  }, 150);
}

function stopScanner(){
  if(html5QrCodeScannerInstance){
    html5QrCodeScannerInstance.clear().catch(error => {
      console.error("Failed to clear html5QrcodeScanner. ", error);
    });
    html5QrCodeScannerInstance = null;
  }
  S.scannerActive = false;
  render();
}

function onScanSuccess(decodedText, decodedResult) {
  S.scanResult = decodedText;
  toast(`¡Boleto escaneado con éxito: ${decodedText}!`);
  stopScanner();
}

function onScanFailure(error) {
  // Manejo de errores de escaneo continuo por fotograma (silencioso)
}

      <div>
        <h4>Feedback</h4>
        <div class="footer-links">
          <a onclick="openFeedback()">Mi experiencia</a>
          <a onclick="openReview()">Reseña</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">© ${new Date().getFullYear()} Star Cinema MX — Todos los derechos reservados.</div>
  </footer>`;
}

function render(){
  let body='';
  if(S.view==='cartelera') body = renderCartelera();
  else if(S.view==='detalle') body = renderDetalle();
  else if(S.view==='dulceria') body = renderDulceria();
  else if(S.view==='pago') body = renderPago();
  else if(S.view==='ticket') body = renderTicket();
  else if(S.view==='pronto') body = renderPronto();
  else if(S.view==='rewards') body = renderRewards();

  $app.innerHTML = `
    ${renderNav()}
    <main style="flex:1;">${body}</main>
    ${renderFooter()}
    ${S._feedbackOpen ? renderFeedbackOverlay() : ''}
    ${S._reviewOpen ? renderReviewOverlay() : ''}
  `;
}

render();
</script>
</body>
</html>
